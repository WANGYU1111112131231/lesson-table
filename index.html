<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>荔枝美学课时表 · Hello Kitty</title>
<style>
  :root{
    --pink:#ef9cab;
    --pink-light:#f7cdd4;
    --pink-bg:#fbf3ec;
    --pink-soft:#f8e7de;
    --pink-deep:#d48997;
    --bow:#efb4be;
    --white:#ffffff;
    --text:#b0958f;
    --text-dark:#6d5a55;
    --shadow:0 8px 24px rgba(190,140,140,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    min-height:100vh;min-height:100dvh;
    background:linear-gradient(160deg,#fdf9f3 0%,#f8ece2 50%,#f5e2d8 100%);
    color:var(--text-dark);
    padding:20px;
  }
  /* ---- 标题横幅 ---- */
  .banner{
    max-width:1060px;margin:0 auto 14px;text-align:center;
    font-size:31px;font-weight:800;letter-spacing:5px;color:#a06976;
    background:linear-gradient(135deg,#fdf6f0,#f8e5dc);
    padding:16px 20px;border-radius:22px;
    border:1px solid #f2d6cb;box-shadow:var(--shadow);
  }
  @media(max-width:640px){.banner{font-size:22px;letter-spacing:3px}}
  /* ---- 顶部 ---- */
  .hero{
    max-width:1060px;margin:0 auto 18px;
    background:linear-gradient(135deg,#fdf7f1,#f9eae1);
    border-radius:24px;border:1px solid #f1d8cd;
    box-shadow:var(--shadow);padding:22px 26px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .date-info h1{font-size:30px;color:var(--pink-deep);letter-spacing:1px;font-weight:800}
  .date-info .sub{font-size:18px;color:var(--text);margin-top:4px;font-weight:500}
  .date-info .msg{font-size:13px;color:#c8a49b;margin-top:6px}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{
    border:none;cursor:pointer;border-radius:40px;
    background:var(--white);color:var(--pink-deep);
    font-size:15px;font-weight:600;padding:10px 18px;
    box-shadow:0 4px 10px rgba(200,150,140,.18);transition:.2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(200,145,135,.28)}
  .btn.primary{background:linear-gradient(135deg,#dda0ad,#c98a96);color:#fff}
  /* ---- 日历 ---- */
  .card{
    max-width:1060px;margin:0 auto;background:var(--white);
    border-radius:24px;padding:20px;
    box-shadow:var(--shadow);border:1px solid #f0d8ce;
  }
  .month-bar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
  .month-bar .month{font-size:24px;font-weight:800;color:var(--pink-deep);min-width:190px;text-align:center}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
  .weekdays div{
    text-align:center;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#dba9b5,#c98a96);
    padding:10px 0;border-radius:12px;font-size:14px;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cell{
    min-height:104px;background:#faf3ec;border-radius:12px;
    border:1px solid transparent;padding:7px;cursor:pointer;
    display:flex;flex-direction:column;transition:.18s;position:relative;
  }
  .cell:hover{border-color:var(--pink-light);transform:translateY(-3px);box-shadow:0 6px 14px rgba(190,140,140,.16)}
  .cell.empty{background:transparent;cursor:default;pointer-events:none}
  .cell.empty:hover{transform:none;box-shadow:none;border-color:transparent}
  .cell.today{border-color:var(--pink-deep);background:var(--pink-soft)}
  .cell .daynum{font-size:16px;font-weight:800;color:var(--pink-deep);line-height:1.2}
  .cell .dow{font-size:10px;color:var(--text)}
  /* 格子内预览 */
  .cell .preview{display:flex;flex-direction:column;gap:3px;margin-top:5px}
  .pre-line{
    border-radius:6px;padding:2px 5px;font-size:9.5px;line-height:1.35;
    color:#6d5a55;background:#fff;border:1px solid #f0d8ce;
    white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .pre-line .lb{display:inline-block;font-size:8.5px;color:#fff;border-radius:4px;padding:0 3px;margin-right:3px}
  .lb-am{background:#8fb8d6}.lb-pm{background:#dda276}.lb-ni{background:#ad8bc4}
  .cell.empty-pre{color:#d4b6ab;font-size:9.5px}
  @media(max-width:640px){
    .cell{min-height:72px;padding:5px}
    .preview{gap:2px;margin-top:3px}
    .pre-line{font-size:8px;padding:1px 3px;-webkit-line-clamp:3}
    .daynum{font-size:13px}
    .date-info h1{font-size:23px}
  }
  /* ---- 弹窗 ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(109,90,85,.35);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex}
  .modal{
    width:min(520px,100%);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(160deg,#fffdfb,#fbf0ea);
    border-radius:22px;padding:24px;box-shadow:0 16px 40px rgba(0,0,0,.18);
    border:1px solid #f0d6cb;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .modal-head h2{font-size:21px;color:var(--pink-deep)}
  .modal-head .close{font-size:26px;cursor:pointer;color:#c99a90;line-height:1;padding:0 6px}
  .modal-head .close:hover{color:var(--pink-deep)}
  /* 三个简洁输入块 */
  .slot-block{margin-bottom:14px;background:#fff;border-radius:12px;padding:14px;border:1px solid #f3e0d6}
  .slot-block h3{font-size:15px;margin-bottom:8px;color:var(--text-dark);display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .dot-am{background:#8fb8d6}.dot-pm{background:#dda276}.dot-ni{background:#ad8bc4}
  .slot-input{
    width:100%;border:1.5px solid #efd9cf;border-radius:10px;padding:10px 12px;
    font-size:16px;outline:none;background:#fffdfb;color:var(--text-dark);
    resize:vertical;min-height:44px;-webkit-user-select:text;font-family:inherit;line-height:1.5;
  }
  .slot-input:focus{border-color:var(--pink);background:#fff}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .toastMsg{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--pink-deep);color:#fff;padding:10px 22px;border-radius:40px;
    font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:99;pointer-events:none;
  }
  .toastMsg.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .footer{max-width:1060px;margin:16px auto 0;text-align:center;font-size:12px;color:#c9a49a}

  /* ---- 宠物猫 ---- */
  .pet-wrap{
    position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;cursor:pointer;
    display:flex;align-items:flex-end;flex-direction:column;user-select:none;
    -webkit-user-select:none;transition:transform .25s ease;
  }
  .pet-wrap:hover{transform:translateY(-4px)}
  .pet-bubble{
    background:#fff;border:1px solid #f0d8ce;color:var(--text-dark);
    border-radius:16px 16px 4px 16px;padding:8px 13px;font-size:13.5px;
    box-shadow:0 6px 18px rgba(200,150,140,.14);margin-bottom:2px;max-width:220px;
    opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease;
    font-weight:600;
  }
  .pet-bubble.show{opacity:1;transform:translateY(0)}
  .pet-img{
    width:150px;height:220px;object-fit:contain;object-position:bottom center;
    filter:drop-shadow(0 10px 14px rgba(180,120,120,.28));
    animation:pet-breathe 3s ease-in-out infinite;
  }
  @keyframes pet-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  @media(max-width:640px){.pet-img{width:110px;height:165px}.pet-bubble{font-size:12.5px;max-width:180px}}

</style>
</head>
<body>

<div class="banner">荔枝美学课时表</div>

<div class="hero">
  <div class="date-info">
    <h1 id="heroDate">2026年10月09日</h1>
    <div class="sub" id="heroWeek">星期五</div>
    <div class="msg">点击任意日期格子 → 填写当天上午 / 下午 / 晚上的课时安排</div>
  </div>
  <div class="controls">
    <button class="btn" id="btnToday">今天</button>
    <button class="btn" id="btnClearMonth">清空本月</button>
  </div>
</div>

<div class="card">
  <div class="month-bar">
    <button class="btn" id="btnPrev">上一月</button>
    <span class="month" id="monthLabel">2026年 10月</span>
    <button class="btn" id="btnNext">下一月</button>
  </div>
  <div class="weekdays">
    <div>周日</div><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="footer">荔枝美学课时表 ｜ 数据自动保存在本机浏览器中</div>

<!-- 编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">编辑日期</h2>
      <span class="close" id="btnClose">✕</span>
    </div>
    <div id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="btnSave">保存</button>
      <button class="btn" id="btnCloseModal">关闭</button>
    </div>
  </div>
</div>

<script>
/* ============ 数据存储 (localStorage) ============ */
const STORE_KEY = 'helloKitty_lesson_schedule';
const SLOT_META = [
  {key:'am', label:'上午', dot:'dot-am', lb:'lb-am'},
  {key:'pm', label:'下午', dot:'dot-pm', lb:'lb-pm'},
  {key:'ni', label:'晚上', dot:'dot-ni', lb:'lb-ni'}
];

// 数据结构: { "YYYY-MM-DD": { am:"...", pm:"...", ni:"..." } }
let data = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
function keyOf(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

/* ============ 日历渲染 ============ */
const WEEK = ['日','一','二','三','四','五','六'];
let viewY, viewM;
let editingKey = null;

function shiftMonth(step){
  let nm = viewM + step, ny = viewY;
  if(nm>11){nm=0;ny++;}
  if(nm<0){nm=11;ny--;}
  viewY=ny; viewM=nm;
  render();
}
function goToday(){
  const n=new Date(); viewY=n.getFullYear(); viewM=n.getMonth();
  render();
}
function clearMonth(){
  if(viewY===undefined) return;
  if(!confirm(`确定要清空 ${viewY} 年 ${viewM+1} 月所有课时记录吗？`)) return;
  const first=new Date(viewY,viewM,1), last=new Date(viewY,viewM+1,0);
  for(let d=first.getDate(); d<=last.getDate(); d++){
    delete data[keyOf(viewY,viewM+1,d)];
  }
  const monthPrefix = keyOf(viewY,viewM+1,1).slice(0,7);
  if(editingKey && editingKey.slice(0,7)===monthPrefix){ closeModal(); }
  save(); render();
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function render(){
  const now = new Date();
  document.getElementById('monthLabel').textContent = `${viewY}年 ${String(viewM+1).padStart(2,'0')}月`;
  const first = new Date(viewY,viewM,1);
  const lead = first.getDay();
  const daysInMonth = new Date(viewY,viewM+1,0).getDate();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  for(let i=0;i<lead;i++){
    const c=document.createElement('div'); c.className='cell empty'; c.textContent='';
    grid.appendChild(c);
  }
  for(let d=1; d<=daysInMonth; d++){
    const k = keyOf(viewY,viewM+1,d);
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(viewY===now.getFullYear() && viewM===now.getMonth() && d===now.getDate()) cell.classList.add('today');
    const dw = WEEK[new Date(viewY,viewM,d).getDay()];
    const rec = data[k] || {};
    let previewHtml = '';
    let any = false;
    SLOT_META.forEach(s=>{
      const txt = (rec[s.key]||'').toString().trim();
      if(txt){
        any = true;
        previewHtml += `<div class="pre-line" title="${s.label}：${esc(txt)}"><span class="lb ${s.lb}">${s.label}</span>${esc(txt)}</div>`;
      }
    });
    if(!any) previewHtml = '<div class="empty-pre">— 暂无安排 —</div>';
    cell.innerHTML = `
      <div class="daynum">${d}</div>
      <div class="dow">周${dw}</div>
      <div class="preview">${previewHtml}</div>`;
    cell.setAttribute('data-key', k);
    grid.appendChild(cell);
  }
  updateHero();
}
function updateHero(){
  const now=new Date();
  document.getElementById('heroDate').textContent =
    `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日`;
  document.getElementById('heroWeek').textContent = '星期' + WEEK[now.getDay()];
}

/* ============ 编辑弹窗 ============ */
function openModal(k){
  editingKey = k;
  const rec = data[k] || {};
  const [y,m,d] = k.split('-').map(Number);
  const dw = WEEK[new Date(y,m-1,d).getDay()];
  document.getElementById('modalTitle').textContent = `${m}月${d}日 星期${dw}`;
  const box = document.getElementById('modalBody');
  box.innerHTML = '';
  SLOT_META.forEach(s=>{
    const block=document.createElement('div');
    block.className='slot-block';
    const h3=document.createElement('h3');
    const dot=document.createElement('span');
    dot.className='dot '+s.dot;
    h3.appendChild(dot);
    h3.appendChild(document.createTextNode(s.label));
    const ta=document.createElement('textarea');
    ta.className='slot-input';
    ta.placeholder='填写「'+s.label+'」的课时安排…';
    ta.value = (rec[s.key]||'').toString();
    ta.setAttribute('data-slot', s.key);
    block.appendChild(h3);
    block.appendChild(ta);
    box.appendChild(block);
  });
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  editingKey=null;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1400);
}
function saveEditing(){
  if(!editingKey) return;
  const rec = data[editingKey] || (data[editingKey]={});
  document.getElementById('modalBody').querySelectorAll('.slot-input').forEach(ta=>{
    rec[ta.getAttribute('data-slot')] = ta.value;
  });
  save(); render(); toast('已保存');
}

/* ============ 事件绑定（统一 addEventListener + 事件委托，避免内联事件失效） ============ */
(function(){
  const overlay=document.getElementById('overlay');
  const calGrid=document.getElementById('calGrid');

  document.getElementById('btnToday').addEventListener('click', goToday);
  document.getElementById('btnClearMonth').addEventListener('click', clearMonth);
  document.getElementById('btnPrev').addEventListener('click', ()=>shiftMonth(-1));
  document.getElementById('btnNext').addEventListener('click', ()=>shiftMonth(1));
  document.getElementById('btnClose').addEventListener('click', closeModal);
  document.getElementById('btnCloseModal').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', saveEditing);

  // 日历格子：点击打开弹窗（事件委托）
  calGrid.addEventListener('click', e=>{
    const cell = e.target.closest('.cell');
    if(!cell || cell.classList.contains('empty')) return;
    const k = cell.getAttribute('data-key');
    if(k) openModal(k);
  });

  // 注意：弹窗打开时点击遮罩空白处不再关闭，
  // 只有点击「×」或「关闭」按钮才会退出，避免误触丢失正在输入的内容。


  /* ============ 宠物猫（丽丽）-------- */
  (function(){
    var wrap=document.getElementById('petWrap');
    var bubble=document.getElementById('petBubble');
    var PHRASES=[
      '丽丽今天辛苦啦！🌸',
      '丽丽要不要来一杯奶茶？🧋',
      '丽丽，休息一下眼睛吧～👀',
      '今天也要元气满满哦！💪',
      '记得把每天的课时记进来哦～📚',
      '丽丽好可爱，摸摸头～🐾',
      '喝口水放松放松吧～🥤',
      '加油加油，丽丽最棒！🌟'
    ];
    var idx=-1, bubbleTimer=null;
    function show(){
      idx++; if(idx>=PHRASES.length) idx=0;
      bubble.textContent=PHRASES[idx];
      bubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer=setTimeout(function(){ bubble.classList.remove('show'); },4500);
    }
    // 每60秒、鼠标靠近、点击 都切换提示语
    setInterval(function(){ show(); },60000);
    wrap.addEventListener('mouseenter', show);
    wrap.addEventListener('click', show);
    // 首次显示欢迎
    setTimeout(show, 1500);
  })();

  goToday();

})();
</script>
